name: NSE Intraday Stock Pick Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'watchlist'
        type: choice
        options:
          - watchlist
          - top2
          - dry-run

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      
      - name: Determine run flags
        id: flags
        run: |
          if [ "${{ github.event.inputs.mode }}" = "top2" ]; then
            echo "args=--top2" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then
            echo "args=--dry-run" >> $GITHUB_OUTPUT
          else
            echo "args=--watchlist" >> $GITHUB_OUTPUT
          fi

      - name: Run intraday pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERTS_ENABLED: 'TRUE'
        run: python main.py ${{ steps.flags.outputs.args }}
      
      - name: Commit database updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/picks.db 2>/dev/null || true
          git add data/watchlist.csv 2>/dev/null || true
          git add docs/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update picks db & web dashboard"
          git push || echo "Nothing to push"

      - name: Deploy Web Dashboard to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
