name: NSE Intraday Stock Pick Bot

on:
  schedule:
    # 03:00 UTC, 03:05 UTC, 03:10 UTC (08:30-08:40 AM IST Mon-Fri) — morning scan at 8:30 AM
    - cron: '0 3 * * 1-5'
    - cron: '5 3 * * 1-5'
    - cron: '10 3 * * 1-5'
    # 09:45 UTC = 03:15 PM IST (Monday-Friday) — squareoff reminder  
    - cron: '45 9 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'scan'
        type: choice
        options:
          - scan
          - squareoff
          - dry-run

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      
      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "45 9 * * 1-5" ]; then
            echo "mode=squareoff" >> $GITHUB_OUTPUT
          else
            echo "mode=scan" >> $GITHUB_OUTPUT
          fi
      
      - name: Run morning scan
        if: steps.mode.outputs.mode == 'scan'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERTS_ENABLED: 'TRUE'
        run: python main.py
      
      - name: Run dry-run scan
        if: steps.mode.outputs.mode == 'dry-run'
        run: python main.py --dry-run
      
      - name: Run squareoff reminder
        if: steps.mode.outputs.mode == 'squareoff'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERTS_ENABLED: 'TRUE'
        run: python squareoff_reminder.py
      
      - name: Commit database updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/picks.db 2>/dev/null || true
          git add data/watchlist.csv 2>/dev/null || true
          git add docs/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update picks db & web dashboard"
          git push || echo "Nothing to push"

      - name: Deploy Web Dashboard to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
